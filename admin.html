<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Fábrica de Sabores</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="login">
  <div class="login-box">
    <h2>FÁBRICA DE SABORES</h2>
    <p>Admin - Pix 38258022806</p>
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">
    <button onclick="logar()">ENTRAR</button>
    <small>Login: admin / Senha: 1234</small>
  </div>
</div>

<div id="painel" style="display:none;">
  <div class="header">
    <h2>Admin Fábrica</h2>
    <div style="display:flex;gap:10px">
      <button onclick="window.open('index.html','_blank')" class="btn-ver">👁️ VER CARDÁPIO</button>
      <button onclick="sair()" class="btn-sair">Sair</button>
    </div>
  </div>

  <div class="box-novo" style="border-color:#00aaff;">
    <h3>🎨 CAPA E LOGO DA LOJA</h3>
    <label>LOGO (clique para escolher da galeria)</label>
    <input type="file" id="file-logo" accept="image/*" hidden onchange="uploadArquivo(this,'cfg-logo','preview-logo')">
    <div style="display:flex;gap:10px">
      <input id="cfg-logo" placeholder="Link do LOGO ou clique na foto ao lado">
      <img id="preview-logo" onclick="document.getElementById('file-logo').click()" style="width:60px;height:60px;border-radius:50%;background:#222;object-fit:cover;border:2px solid #f5c542;cursor:pointer" title="Clique para trocar">
    </div>

    <label style="margin-top:10px;display:block">CAPA</label>
    <input type="file" id="file-capa" accept="image/*" hidden onchange="uploadArquivo(this,'cfg-capa','preview-capa',true)">
    <input id="cfg-capa" placeholder="Link da CAPA">
    <div id="preview-capa" onclick="document.getElementById('file-capa').click()" style="height:70px;border-radius:8px;background:#222;background-size:cover;background-position:center;border:1px dashed #555;cursor:pointer;margin-top:5px;display:flex;align-items:center;justify-content:center;color:#777">Clique para trocar capa</div>

    <input id="cfg-nome" placeholder="Nome da loja Ex: Fábrica de Sabores" style="margin-top:10px">
    <button onclick="salvarConfig()" style="background:#00aaff;color:#fff;">💾 SALVAR CAPA E LOGO</button>
  </div>

  <div class="box-novo">
    <h3>➕ Novo Produto</h3>
    <select id="novo-cat">
      <option value="lanches">🍔 Lanches</option>
      <option value="porcoes">🍟 Porções</option>
      <option value="bebidas">🥤 Bebidas</option>
      <option value="acai">🍧 Açaí</option>
    </select>
    <input id="novo-nome" placeholder="Nome do produto">
    <textarea id="novo-desc" placeholder="Descrição"></textarea>
    <input id="novo-preco" type="number" step="0.01" placeholder="Preço ex: 25.90">

    <label>Foto do produto</label>
    <div style="display:flex;gap:10px">
      <input id="novo-foto" placeholder="Cole link ou escolha arquivo ao lado" style="flex:1">
      <input type="file" id="file-prod" accept="image/*" hidden onchange="uploadArquivo(this,'novo-foto','preview-novo')">
      <button type="button" onclick="document.getElementById('file-prod').click()" style="width:100px;background:#f5c542;color:#000">📁 GALERIA</button>
    </div>
    <img id="preview-novo" style="width:100%;max-height:180px;object-fit:cover;border-radius:8px;margin-top:8px;display:none;background:#222">

    <button onclick="adicionar()">SALVAR PRODUTO</button>
  </div>

  <div class="acoes">
    <button onclick="salvarTudo()" class="btn-salvar">💾 SALVAR TUDO E ATUALIZAR SITE</button>
  </div>

  <div id="lista-admin"></div>
</div>

<script src="admin.js"></script>
</body>
</html>
